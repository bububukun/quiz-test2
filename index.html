<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ならクリッカー</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background: #fff8dc;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-top: 10px;
    }
    #cookie {
      width: 200px;
      height: 200px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Chocolate_Chip_Cookie.png/240px-Chocolate_Chip_Cookie.png') no-repeat center/cover;
      margin: 30px auto;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    #cookie:active {
      transform: scale(1.1);
    }
    #score {
      font-size: 2em;
      margin: 10px 0;
    }
    .shop {
      margin: 20px auto;
      max-width: 400px;
    }
    .item {
      background: #fff;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item button {
      padding: 5px 10px;
    }
    .info {
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>ならクリッカー</h1>
  <div id="cookie"></div>
  <div id="score">なら：0</div>

  <div class="shop">
    <div class="item">
      <div class="info">
        <strong>👋 手作り</strong><br>
        +1なら/秒
      </div>
      <button onclick="buy('hand')">購入（<span id="cost-hand">15</span>）</button>
    </div>
    <div class="item">
      <div class="info">
        <strong🏭 工場</strong><br>
        +5なら/秒
      </div>
      <button onclick="buy('factory')">購入（<span id="cost-factory">100</span>）</button>
    </div>
    <div class="item">
      <div class="info">
        <strong>🤖 ロボット</strong><br>
        +20なら/秒
      </div>
      <button onclick="buy('robot')">購入（<span id="cost-robot">500</span>）</button>
    </div>
  </div>

  <script>
    let cookies = 0;

    const upgrades = {
      hand:    { count: 0, cps: 1, cost: 15 },
      factory: { count: 0, cps: 5, cost: 100 },
      robot:   { count: 0, cps: 20, cost: 500 }
    };

    const scoreDisplay = document.getElementById('score');
    const cookieEl = document.getElementById('cookie');

    cookieEl.addEventListener('click', () => {
      cookies++;
      updateDisplay();
    });

    function updateDisplay() {
      scoreDisplay.textContent = `クッキー：${Math.floor(cookies)}`;
      for (let key in upgrades) {
        document.getElementById(`cost-${key}`).textContent = Math.floor(upgrades[key].cost);
      }
    }

    function buy(type) {
      const upgrade = upgrades[type];
      if (cookies >= upgrade.cost) {
        cookies -= upgrade.cost;
        upgrade.count++;
        upgrade.cost *= 1.2; // コストは20%ずつ上昇
        updateDisplay();
      }
    }

    // 自動生産
    setInterval(() => {
      let totalCps = 0;
      for (let key in upgrades) {
        totalCps += upgrades[key].count * upgrades[key].cps;
      }
      cookies += totalCps;
      updateDisplay();
    }, 1000);

    updateDisplay();
  </script>
</body>
</html>
